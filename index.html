<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jujutsu Kaisen: Cursed Clash</title>
    <link rel="stylesheet" href="style.css">
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
            }
        }
    </script>
</head>
<body>

    <!-- 1. ЭКРАН ВХОДА (Auth) -->
    <div id="auth-container">
        <div class="login-box">
            <h1>JUJUTSU<br>GAME</h1>
            <p class="subtitle">Вход в систему</p>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Пароль">
            <div class="buttons">
                <button id="btn-login">ВОЙТИ</button>
                <button id="btn-register" class="outline">РЕГИСТРАЦИЯ</button>
            </div>
            <p id="msg"></p>
        </div>
    </div>

    <!-- 2. ГЛАВНОЕ МЕНЮ (Lobby) -->
    <div id="menu-container" style="display: none;">
        <div class="menu-box">
            <h2 id="menu-username">МАГ</h2>
            <div class="menu-list">
                <button id="btn-play" class="menu-btn primary">НАЧАТЬ БИТВУ</button>
                <button id="btn-settings" class="menu-btn">НАСТРОЙКИ</button>
                <button id="btn-logout" class="menu-btn danger">ВЫЙТИ ИЗ АККАУНТА</button>
            </div>
        </div>
    </div>

    <!-- 3. ИГРОВОЙ ИНТЕРФЕЙС (HUD) -->
    <div id="game-ui" style="display: none;">
        <div class="top-bar">
            <div class="hp-bar"><div class="hp-fill"></div></div>
            <button id="btn-exit-game">МЕНЮ</button>
        </div>

        <!-- ДЖОЙСТИК -->
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <!-- 4. 3D МИР -->
    <div id="game-canvas"></div>

    <script type="module" src="main.js"></script>
</body>
</html>
