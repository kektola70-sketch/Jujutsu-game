<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jujutsu Game - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Экран авторизации -->
    <div id="auth-container" class="container">
        <h1>Jujutsu Kaisen Game</h1>
        <p>Добро пожаловать в техникум магии</p>
        
        <div class="auth-box">
            <input type="email" id="email" placeholder="Email мага">
            <input type="password" id="password" placeholder="Пароль">
            
            <div class="buttons">
                <button id="btn-login" class="btn primary">Войти</button>
                <button id="btn-register" class="btn secondary">Регистрация</button>
            </div>

            <hr>
            
            <button id="btn-google" class="btn google">Войти через Google</button>
            <button id="btn-anon" class="btn anon">Войти анонимно (Рёмен Сукуна?)</button>
        </div>
        <p id="error-message" class="error"></p>
    </div>

    <!-- Экран игры (появится после входа) -->
    <div id="game-container" class="container hidden">
        <h1>Профиль Шамана</h1>
        <p>Привет, <span id="user-display"></span>!</p>
        <p>UID: <small id="user-uid"></small></p>
        
        <button id="btn-logout" class="btn logout">Выйти</button>
    </div>

    <!-- Подключаем скрипт как модуль -->
    <script type="module" src="main.js"></script>
</body>
</html>
