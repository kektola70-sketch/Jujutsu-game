<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jujutsu Kaisen: Modular</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js", "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js" } }
    </script>
</head>
<body>

    <!-- ВХОД / МЕНЮ (Оставляем как было, сокращенно для примера) -->
    <div id="auth-container" class="screen"><div class="box"><h1>JUJUTSU GAME</h1><button id="btn-login" class="menu-btn primary">ВОЙТИ</button></div></div>
    <div id="menu-container" class="screen" style="display:none;"><div class="box"><button id="btn-play" class="menu-btn primary">ИГРАТЬ</button></div></div>

    <!-- UI ИГРЫ -->
    <div id="game-ui" style="display: none;">
        <!-- Черные полосы (Кино-эффект) -->
        <div id="cinematic-bars">
            <div class="bar top"></div>
            <div class="bar bottom"></div>
        </div>

        <div class="top-bar">
            <div class="hp-wrapper"><span>GOJO</span><div class="hp-bar"><div id="hp-player" class="hp-fill"></div></div></div>
            <div class="hp-wrapper enemy"><span>SUKUNA</span><div class="hp-bar"><div id="hp-enemy" class="hp-fill"></div></div></div>
        </div>

        <div id="controls-layer">
            <div id="joystick-zone"><div id="joystick-knob"></div></div>
            <div id="camera-touch-zone"></div>
            <div class="combat-buttons">
                <button id="btn-domain" class="c-btn domain-btn" style="display:none;">DOMAIN EXPANSION</button>
                <div class="main-actions">
                    <button id="btn-strong" class="c-btn medium">👊</button>
                    <button id="btn-attack" class="c-btn big">⚔️</button>
                </div>
            </div>
        </div>

        <!-- CLASH UI -->
        <div id="clash-ui" style="display: none;">
            <h2>DOMAIN CLASH</h2>
            <div class="clash-bar-bg"><div id="clash-fill" class="clash-fill"></div></div>
            <button id="btn-clash-mash">ДАВИТЬ!</button>
        </div>

        <!-- НОВЫЙ ИНТЕРФЕЙС КАТСЦЕН -->
        <div id="cutscene-ui" style="display: none;">
            <div class="dialogue-container">
                <h3 id="d-name">Speaker</h3>
                <p id="d-text">Text goes here...</p>
                <button id="btn-next-dialogue">ДАЛЕЕ ▶</button>
            </div>
        </div>
    </div>

    <div id="game-canvas"></div>
    <!-- ГЛАВНЫЙ СКРИПТ (из папки js) -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
